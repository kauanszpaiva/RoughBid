name: Pricing Context Branch CI

on:
  push:
    branches:
      - feat/pricing-context-workstream-01
  workflow_dispatch:

concurrency:
  group: pricing-context-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4 trusted pricing context persistence
        run: node --experimental-strip-types --test apps/api/test/pricing-context-persistence.test.ts apps/api/test/pricing-context.test.ts apps/api/test/ai-plan-service.test.ts
      - name: Backend typecheck
        run: npx tsc --noEmit
      - name: Web typecheck
        run: npx tsc --noEmit -p apps/web/app/tsconfig.json
      - name: Database schema validation
        env:
          DATABASE_URL: postgresql://validate:validate@127.0.0.1:5432/validate
        run: npm run db:validate
      - name: Domain tests
        run: npm run test:domain
      - name: API tests
        run: npm run test:api
      - name: MCP tests
        run: npm run test:mcp
      - name: Web tests
        run: npm run test:web
      - name: Supabase tests
        run: node --test supabase/test/*.test.mjs
      - name: Prisma tests
        run: node --test prisma/*.test.mjs
      - name: Production build compile check
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only_no_access
        run: npm run build
