name: Pricing Context Branch CI

on:
  push:
    branches:
      - feat/pricing-context-workstream-01
  workflow_dispatch:

concurrency:
  group: pricing-context-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Backend typecheck
        run: npx tsc --noEmit
      - name: Web typecheck
        run: npx tsc --noEmit -p apps/web/app/tsconfig.json
      - name: Database schema validation
        env:
          DATABASE_URL: postgresql://validate:validate@127.0.0.1:5432/validate
        run: npm run db:validate
      - name: Full monorepo tests
        run: npm test
      - name: Production build compile check
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only_no_access
        run: npm run build
