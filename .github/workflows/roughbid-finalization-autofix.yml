name: RoughBid Finalization Autofix

on:
  push:
    branches:
      - agent/chat-roughbid-finalize
    paths:
      - .github/workflows/roughbid-finalization-autofix.yml

permissions:
  contents: write

jobs:
  repair-type-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-roughbid-finalize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact type-safety repairs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected repair target not found in ${path}; refusing stale/concurrent rewrite.`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'apps/web/app/src/App.tsx',
            `      findingId: item.findingId,\n      pageNumber: item.pageNumber,\n      area: item.area,\n      sourceExcerpt: item.sourceExcerpt,\n      pricingStatus,\n      pricingSource: costOverride?.pricingSource,`,
            `      pricingStatus,\n      ...(item.findingId === undefined ? {} : { findingId: item.findingId }),\n      ...(item.pageNumber === undefined ? {} : { pageNumber: item.pageNumber }),\n      ...(item.area === undefined ? {} : { area: item.area }),\n      ...(item.sourceExcerpt === undefined ? {} : { sourceExcerpt: item.sourceExcerpt }),\n      ...(costOverride?.pricingSource === undefined ? {} : { pricingSource: costOverride.pricingSource }),`
          );

          replaceExact(
            'apps/web/app/src/components/AIPlanModal.tsx',
            `          findingId: finding.id,\n          pageNumber: finding.page_number ?? undefined,\n          area,\n          sourceExcerpt: finding.source_excerpt ?? undefined,`,
            `          findingId: finding.id,\n          area,\n          ...(finding.page_number === null ? {} : { pageNumber: finding.page_number }),\n          ...(finding.source_excerpt === null ? {} : { sourceExcerpt: finding.source_excerpt }),`
          );

          replaceExact(
            'apps/web/app/src/components/BlueprintViewer.tsx',
            `    if (!Array.isArray(box) || box.length !== 4 || !box.every(n => typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= 1)) return null;\n    const [x, y, width, height] = box as number[];\n    return width! > 0 && height! > 0 && x! + width! <= 1 && y! + height! <= 1 ? box as number[] : null;`,
            `    if (!Array.isArray(box) || box.length !== 4) return null;\n    const [x, y, width, height] = box;\n    if (x === undefined || y === undefined || width === undefined || height === undefined) return null;\n    if (![x, y, width, height].every(n => typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= 1)) return null;\n    return width > 0 && height > 0 && x + width <= 1 && y + height <= 1 ? [x, y, width, height] : null;`
          );
          NODE
      - name: Verify repaired web typecheck
        run: npx tsc --noEmit -p apps/web/app/tsconfig.json
      - name: Verify focused provenance and responsive regressions
        run: node --import tsx --test apps/web/test/ai-findings-area-report.test.ts apps/web/test/responsive-layout.test.ts apps/web/test/workspace-access.test.ts
      - name: Commit repaired source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/src/App.tsx apps/web/app/src/components/AIPlanModal.tsx apps/web/app/src/components/BlueprintViewer.tsx
          git diff --cached --check
          git commit -m "fix: restore strict web type safety after provenance integration"
          git push origin HEAD:agent/chat-roughbid-finalize
