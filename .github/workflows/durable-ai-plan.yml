name: Durable AI Plan Gate

on:
  push:
    branches:
      - codex/durable-ai-plan-worker
  pull_request:
    paths:
      - 'apps/api/src/ai-plan/**'
      - 'apps/api/test/ai-plan-durable.test.ts'
      - 'apps/web/app/src/pages/PlansPage.tsx'
      - 'apps/web/app/src/utils/aiPlanStatus.ts'
      - 'apps/web/test/ai-plan-status.test.ts'
      - 'scripts/worker.ts'
      - 'supabase/migrations/**'
      - 'supabase/test/durable-ai-plan.test.mjs'
      - 'package.json'
      - 'Dockerfile.worker'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Durable API contract
        run: node --experimental-strip-types --test apps/api/test/ai-plan-durable.test.ts
      - name: Durable database state machine
        run: node --test supabase/test/durable-ai-plan.test.mjs
      - name: Durable UI status contract
        run: node --experimental-strip-types --test apps/web/test/ai-plan-status.test.ts
