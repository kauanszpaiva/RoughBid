name: Durable AI Plan Gate

on:
  push:
    branches:
      - codex/durable-ai-plan-worker
  pull_request:
    paths:
      - '.github/workflows/durable-ai-plan.yml'
      - 'apps/api/src/**'
      - 'apps/api/test/**'
      - 'api/**'
      - 'apps/web/app/src/**'
      - 'apps/web/test/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'supabase/test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.worker'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Provider HTTP boundary, safe diagnostics, and persisted result reload
        run: node --experimental-strip-types --test apps/api/test/ai-reading-reload.test.ts apps/api/test/ai-provider-diagnostics.test.ts apps/web/test/provider-preflight.test.ts apps/web/test/reading-schema-preflight.test.ts
      - name: Founder consent and billing regression
        run: node --experimental-strip-types --test apps/api/test/founder-consent-regression.test.ts
      - name: Durable API contract
        run: node --experimental-strip-types --test apps/api/test/ai-plan-durable.test.ts
      - name: Durable database state machine and lease recovery
        run: node --test supabase/test/durable-ai-plan.test.mjs supabase/test/durable-ai-plan-lease.test.mjs
      - name: Durable UI status contract
        run: node --experimental-strip-types --test apps/web/test/ai-plan-status.test.ts
      - name: Backend and worker typecheck
        run: npx tsc --noEmit
      - name: Web app typecheck
        run: npx tsc --noEmit -p apps/web/app/tsconfig.json
      - name: Full monorepo test suite
        run: npm test
      - name: Production build with compile-only public config
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only_no_access
        run: npm run build
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix .browser-tests --no-package-lock --no-audit --no-fund playwright@1.58.2
          node .browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Desktop and mobile PDF viewer under production CSP
        run: node scripts/test-blueprint-browser.mjs
      - name: AI review recovery and pricing evidence boundary
        run: node scripts/test-ai-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-blueprint-browser-evidence
          path: test-results/*.png
          retention-days: 2
          if-no-files-found: ignore
